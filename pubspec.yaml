name: fumble
description: "Flumble — a premium, private way to exchange contact cards in real life."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  path: ^1.9.1
  sqflite: ^2.4.2+1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  webview_flutter: ^4.13.0
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.4
  connectivity_plus: ^7.1.1
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  uuid: ^4.5.1

  firebase_core: ^4.12.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.1
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0
  firebase_messaging: ^16.0.4
  firebase_app_check: ^0.4.1

  mobile_scanner: ^7.1.3
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  share_plus: ^12.0.2
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
   - assets/images/
   - assets/icons/
