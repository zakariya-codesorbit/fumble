name: fumble
description: "fumble — a premium, private way to exchange contact cards in real life."
publish_to: 'none'

# App Version 1 (not live). name+build → Flutter versionName / versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  path: ^1.9.1
  sqflite: ^2.4.6
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  flutter_svg: ^2.4.0
  url_launcher: ^6.3.3
  shimmer: ^4.0.0
  webview_flutter: ^4.14.1
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  uuid: ^4.6.0

  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_analytics: ^13.1.0
  firebase_crashlytics: ^6.1.0
  firebase_app_check: ^0.5.2
  firebase_storage: ^14.1.0

  mobile_scanner: ^7.5.0
  cached_network_image: ^4.0.7
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  country_code_picker: ^3.4.1
  pretty_qr_code: ^3.6.0
  encrypt: ^5.0.3
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  speech_to_text: ^7.5.0
  image_cropper: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
   - assets/icons/
   - assets/avatars/
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
